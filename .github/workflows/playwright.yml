name: Playwright Tests

on:
  push:              # every push to every branch
  pull_request:      # every PR
  workflow_dispatch: # manual runs for timing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    # Self-hosted runner: practicesoftwaretesting.com shows a bot-check page to
    # GitHub-hosted (data-centre) IPs, so tests that log in fail on ubuntu-latest.
    # 4 runners registered on one machine let the 4 shards run in parallel.
    runs-on: self-hosted
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1]   # TEMP: "before" timing run (1 job, no sharding); restore [1, 2, 3, 4]
        shardTotal: [1]   # TEMP: restore [4]
    steps:
      - uses: actions/checkout@v4

      # Windows self-hosted runner only:
      # 1. npm's default cache there is the machine's shared cache (several GB from every
      #    project), and setup-node would upload all of it. Use a per-job folder instead,
      #    so the cache holds only this project's packages, like on a GitHub-hosted runner.
      # 2. The cache action packs with Git's tar.exe, which spawns gzip from Git\usr\bin;
      #    that folder is not on the runner's PATH ("Child returned status 127").
      - name: Prepare npm cache (Windows self-hosted runner)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_ENV -Value "npm_config_cache=$env:RUNNER_TEMP\npm-cache"
          Add-Content -Path $env:GITHUB_PATH -Value 'C:\Program Files\Git\usr\bin'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm                 # caches npm's cache dir, keyed on package-lock.json + OS

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        run: npx playwright test --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
        env:
          # Optional overrides (Settings -> Secrets and variables -> Actions).
          # Empty values fall back to the defaults in playwright.config.ts / tests/helpers.
          BASE_URL: ${{ vars.BASE_URL }}
          API_URL: ${{ vars.API_URL }}
          TEST_USER_PASSWORD: ${{ secrets.TEST_USER_PASSWORD }}

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: blob-report
          retention-days: 1          # intermediate file

      - name: Upload traces and JUnit
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shardIndex }}
          path: |
            test-results/
            reports/
          retention-days: 14

  merge-reports:
    name: Merge reports
    if: ${{ !cancelled() }}
    needs: [test]
    runs-on: ubuntu-latest   # does not open the site, so a GitHub-hosted runner is fine
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Download blob reports
        uses: actions/download-artifact@v4
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      - name: Merge into HTML + JUnit
        run: npx playwright merge-reports --config merge.config.ts ./all-blob-reports

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

      - name: Upload merged JUnit
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: reports/junit-merged.xml
          retention-days: 14
